# Proxy API calls to the Spring Boot backend (replace with your Render URL)
[[redirects]]
  from = "/api/*"
  to = "https://rolexapp.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback for react-router (must come last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
