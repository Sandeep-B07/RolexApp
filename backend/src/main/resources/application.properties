spring.application.name=rolex-backend
# Render (and most PaaS) inject a PORT env var — the app MUST listen on it.
# Falls back to 8080 for local development.
server.port=${PORT:8080}

# Database — defaults work locally; on the server set these env vars instead:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rolexdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Load sample watches on startup (idempotent thanks to ON CONFLICT in data.sql)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

logging.level.com.rolexapp=INFO
